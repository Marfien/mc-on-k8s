{{- if .Values.rbac.enabled . }}
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: "ClusterRole"
metadata:
  name: "minecraftserverreconciler-cluster-role"
rules:
- apiGroups:
  - "mconk8s.marfien.dev"
  resources:
  - "minecraftservers"
  - "minecraftservers/status"
  - "minecraftservers/finalizers"
  verbs:
  - "get"
  - "list"
  - "watch"
  - "patch"
  - "update"
  - "create"
  - "delete"
- apiGroups:
  - "agones.dev"
  resources:
  - "gameservers"
  verbs:
  - "get"
  - "list"
  - "watch"
  - "patch"
  - "update"
  - "delete"
  - "create"
{{- end }}
