[versions]
grpc = "1.64.1"
quarkus = "3.10.2"

[libraries]
lombok = { group = "org.projectlombok", name = "lombok", version = "1.18.32" }
sundrio-builder = { group = "io.sundr", name = "builder-annotations", version = "0.200.0" }

slf4j-api = { group = "org.slf4j", name = "slf4j-api", version = "2.0.13" }

grpc-netty = { group = "io.grpc", name = "grpc-netty", version.ref = "grpc" }
grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpc" }
grpc-protobuf = { group = "io.grpc", name = "grpc-protobuf", version.ref = "grpc" }
tomcat-annotations-api = { group = "org.apache.tomcat", name = "annotations-api", version = "6.0.53" }

agones4j = { group = "net.infumia", name = "agones4j", version = "2.0.0" }
kubernetes-client = { group = "io.fabric8", name = "kubernetes-client", version = "[6.10,7.0[" }
kubernetes-crdsgen = { group = "io.fabric8", name = "crd-generator-apt", version = "6.11.0" }

quarkus-platform-core = { group = "io.quarkus.platform", name = "quarkus-bom", version.ref = "quarkus" }
quarkus-platform-operatorsdk = { group = "io.quarkus.platform", name = "quarkus-operator-sdk-bom", version.ref = "quarkus" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
shadow = { id = "com.github.johnrengelman.shadow", version = "8.1.1" }
spotless = { id = "com.diffplug.spotless", version = "6.23.2" }
jandex = { id = "org.kordamp.gradle.jandex", version = "2.0.0" }

[bundles]
annotations = ["lombok", "sundrio-builder"]
agones = ["grpc-stub", "grpc-protobuf", "tomcat-annotations-api", "agones4j"]
